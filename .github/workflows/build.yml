name: Build WindUI (main)

on:
  push:
    branches: ["main", "fluent-integration"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: ok-nick/setup-aftman@v0.3.0
      - run: aftman install
      - run: bash build/setup-test-tools.sh
      - run: npm run build
      - run: npm test
      - run: rojo build tests/fluent/studio.project.json --output WindUI-Gallery.rbxlx
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windui-distribution
          path: |
            dist/main.lua
            WindUI-Gallery.rbxlx
